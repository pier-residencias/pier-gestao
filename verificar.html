<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Verificar termo · Pier Residências</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--fg:#163047;--muted:#5b6b7a}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 48px}
.topo{text-align:center;margin-bottom:14px}.topo img{width:170px;max-width:55%;height:auto}
.card{background:var(--card);border:1px solid #d9e1e8;border-radius:16px;padding:18px}
.estado{text-align:center;padding:30px 10px}.estado h2{margin:10px 0 6px}.estado p{color:var(--muted);margin:0}
.ok svg{width:90px;height:90px;fill:none;stroke:#2e7d4f;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.spin{display:inline-block;width:22px;height:22px;border:3px solid #cfd9e2;border-top-color:#17324d;border-radius:50%;animation:g .8s linear infinite}@keyframes g{to{transform:rotate(360deg)}}
.rod{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
h1{font-size:22px;margin:0 0 4px}.mut{color:var(--muted);margin:0 0 14px}
.lin{display:flex;flex-wrap:wrap;gap:10px}.in{font:inherit;font-size:18px;letter-spacing:.08em;text-transform:uppercase;padding:11px 14px;border:1px solid #c9d3dc;border-radius:10px;flex:1 1 220px}
.bt{font:inherit;font-weight:700;padding:11px 20px;border-radius:10px;border:0;background:#17324d;color:#fff;cursor:pointer}
.res{margin-top:16px;border-radius:12px;padding:14px 16px;display:none}.res.ok{display:block;background:#eaf6ef;border:1px solid #9fd1b2}.res.err{display:block;background:#fdf0ee;border:1px solid #f0b8ae;color:#8f2a1b}
.res dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0}.res dt{font-weight:700}.res dd{margin:0;overflow-wrap:anywhere}
.pdf{margin-top:14px;padding-top:12px;border-top:1px solid #c9d3dc}.pdf p{margin:0 0 8px}.selo{margin-top:8px;font-weight:700}.selo.ok{color:#1f6f43}.selo.err{color:#c0392b}
</style>
</head>
<body>
<main>
  <div class="topo"><img src="img/logo-oficial.png" alt="Pier Residências" width="380" height="115"></div>
  <section class="card">
    <h1>Verificar termo assinado</h1>
    <p class="mut">Digite o código de autenticidade que aparece no termo do Espaço Gourmet (formato PIER-XXXX-XXXX).</p>
    <form class="lin" id="f"><input class="in" id="c" maxlength="14" placeholder="PIER-XXXX-XXXX" autocomplete="off" aria-label="Código de autenticidade"><button class="bt" type="submit">Verificar</button></form>
    <div class="res" id="res" role="status"></div>
  </section>
  <p class="rod">Pier Residências · Administração · verificação de termos pelo Pier Gestão</p>
</main>
<script src="config.js"></script>
<script src="verificar.js?v=20261127te"></script>
</body>
</html>
